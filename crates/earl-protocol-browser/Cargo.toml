[package]
name = "earl-protocol-browser"
version = "0.5.1"
edition.workspace = true
description = "Browser automation protocol for earl (chromiumoxide)"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["agent", "automation", "browser", "chromium"]
categories = ["web-programming"]

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
earl-core = { path = "../earl-core", version = "0.5.1" }
fs4 = { version = "1.1", features = ["tokio"] }
futures = "0.3"
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
which = "8.0"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
