[package]
name = "earl-protocol-sql"
version = "0.5.1"
edition.workspace = true
description = "SQL execution protocol for earl (sqlx)"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["agent", "database", "sql", "sqlx"]
categories = ["database"]

[dependencies]
anyhow = "1.0"
earl-core = { path = "../earl-core", version = "0.5.1" }
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["any", "mysql", "postgres", "runtime-tokio", "sqlite", "tls-rustls"] }
tokio = { version = "1", features = ["time"] }
