[package]
name = "earl-protocol-bash"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
description = "Bash sandboxed execution protocol for earl"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["agent", "bash", "sandboxing", "security"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
earl-core = { path = "../earl-core", version = "0.6.2" }
libc = "0.2"
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
