[package]
name = "earl"
version = "0.6.3"
edition.workspace = true
rust-version.workspace = true
description = "AI-safe CLI for AI agents"
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["agent", "ai", "cli", "sandboxing", "security"]
categories = ["command-line-utilities", "network-programming"]
build = "build.rs"

[workspace]
resolver = "3"
members = [
  ".",
  "crates/earl-core",
  "crates/earl-protocol-bash",
  "crates/earl-protocol-browser",
  "crates/earl-protocol-grpc",
  "crates/earl-protocol-http",
  "crates/earl-protocol-sql",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
documentation = "https://mathematic-inc.github.io/earl"
homepage = "https://github.com/mathematic-inc/earl"
repository = "https://github.com/mathematic-inc/earl"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
comfy-table = "8.0"
directories = "6.0"
earl-core = { path = "crates/earl-core", version = "0.6.3" }
earl-protocol-bash = { path = "crates/earl-protocol-bash", version = "0.6.3", optional = true }
earl-protocol-browser = { path = "crates/earl-protocol-browser", version = "0.6.3", optional = true }
earl-protocol-grpc = { path = "crates/earl-protocol-grpc", version = "0.6.3", optional = true }
earl-protocol-http = { path = "crates/earl-protocol-http", version = "0.6.3", optional = true }
earl-protocol-sql = { path = "crates/earl-protocol-sql", version = "0.6.3", optional = true }
fastembed = { version = "6.0", optional = true }
hcl = { package = "hcl-rs", version = "0.19.8" }
hickory-resolver = "0.26"
include_dir = "0.7"
jsonwebtoken = "11"
keyring = "4.1.6"
mime_guess = "2.0"
minijinja = { version = "2.24", features = ["json", "loader"] }
oauth2 = { version = "5.0", default-features = false, features = ["pkce-plain", "reqwest", "rustls-tls"] }
percent-encoding = "2.3.2"
regex = "1.13"
reqwest = { version = "0.13.4", features = ["brotli", "deflate", "form", "gzip", "json", "multipart", "query", "rustls", "zstd"] }
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
rpassword = "7.5.4"
scraper = "0.27.0"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sxd-document = "0.3"
sxd-xpath = "0.4"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
vaultrs = { version = "0.8", optional = true }
webbrowser = "1.2"

[dev-dependencies]
assert_cmd = "2.2"
httpmock = "0.8"
insta = { version = "1.48", features = ["yaml"] }
tempfile = "3.27"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = ["bash", "browser", "graphql", "grpc", "http", "local-search", "sql"]
bash = ["dep:earl-protocol-bash"]
browser = ["dep:earl-protocol-browser"]
graphql = ["http"]
grpc = ["dep:earl-protocol-grpc"]
http = ["dep:earl-protocol-http"]
local-search = ["dep:fastembed"]
secrets-1password = []
secrets-aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
secrets-azure = []
secrets-gcp = []
secrets-vault = ["dep:vaultrs"]
sql = ["dep:earl-protocol-sql"]

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
